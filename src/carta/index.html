<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b70011" />
    <title>Avanzar In Time — Carta</title>
    <link rel="stylesheet" href="/carta/styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="top" id="top">
        <div class="top__row">
          <div class="brand">
            <div class="brand__mark" aria-hidden="true">A</div>
            <div class="brand__text">
              <h1 class="brand__name" id="restaurant-name">Avanzar In Time</h1>
              <p class="brand__tag" id="welcome"></p>
            </div>
          </div>
          <div class="controls">
            <div class="seg" id="lang-seg" role="group" aria-label="Idioma"></div>
            <div class="seg" id="currency-seg" role="group" aria-label="Moneda"></div>
          </div>
        </div>
      </header>

      <div class="rate" id="rate-bar" hidden></div>

      <nav class="cats" id="cat-nav" aria-label="Categorías"></nav>

      <main class="main" id="main">
        <p class="loading" id="loading">Cargando carta…</p>
      </main>

      <footer class="foot" id="footer"></footer>
    </div>
    <script type="module" src="/carta/main.ts"></script>
  </body>
</html>
